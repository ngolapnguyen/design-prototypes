name: Deploy to GitHub Pages

on:
  push:
    # github-pages environment only allows these branches to deploy.
    # lululemon is still built into ./lululemon/ whenever this workflow runs.
    branches: [main, fabletics]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build each branch into a subfolder
        run: |
          set -euo pipefail
          mkdir -p site
          touch site/.nojekyll
          git fetch origin main fabletics lululemon chat-explorations homepage modals-tooltip --prune || true

          for branch in main fabletics lululemon chat-explorations homepage modals-tooltip; do
            if ! git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
              echo "Skipping ${branch} (not on origin)"
              continue
            fi

            work="${RUNNER_TEMP}/build-${branch}"
            rm -rf "$work"
            git worktree add --detach "$work" "origin/${branch}"
            (
              cd "$work"
              npm ci
              npx vite build --base "/design-prototypes/${branch}/" --outDir dist
              mkdir -p "${GITHUB_WORKSPACE}/site/${branch}"
              cp -R dist/. "${GITHUB_WORKSPACE}/site/${branch}/"
            )
            git worktree remove --force "$work" || rm -rf "$work"
          done

          if git cat-file -e origin/lululemon:pages/gate.html 2>/dev/null; then
            git show origin/lululemon:pages/gate.html > site/index.html
            if git cat-file -e origin/lululemon:pages/plot-logo.png 2>/dev/null; then
              git show origin/lululemon:pages/plot-logo.png > site/plot-logo.png
            fi
          elif [ -f pages/gate.html ]; then
            cp pages/gate.html site/index.html
            if [ -f pages/plot-logo.png ]; then
              cp pages/plot-logo.png site/plot-logo.png
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fabletics'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
